# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for nuget
  - package-ecosystem: "nuget"
    directory: "dotnet/"
    # The samples tree contains most of the .NET package manifests and causes
    # the NuGet updater to exceed Dependabot's fixed execution timeout. Keep the
    # production source, tests, and central package versions in scope so updates
    # can be opened again.
    exclude-paths:
      - "samples/**"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * 4,0" # Every Thursday(4) and Sunday(0) at 8:00 UTC
    groups:
      agent-memory:
        patterns:
          - "AgentMemory"
          - "AgentMemory.AgentFramework"
      aspire:
        patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
      azure-ai-agentserver:
        patterns:
          - "Azure.AI.AgentServer.*"
      agui:
        patterns:
          - "AGUI.*"
      communitytoolkit-vectordata:
        patterns:
          - "CommunityToolkit.VectorData.*"
      anthropic:
        patterns:
          - "Anthropic*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
          - "Azure.Monitor.OpenTelemetry.Exporter"
    ignore:
      # For all System.* and Microsoft.Extensions/Bcl.* packages, ignore all major version updates
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Bcl.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Moq"
    labels:
      - ".NET"
      - "dependencies"
    cooldown:
      default-days: 7

  # Maintain dependencies for python.
  # TODO: Remove these Python Dependabot entries after we have confidence in the
  # Python dependency-maintenance workflow.
  - package-ecosystem: "pip"
    directories:
      - "python/"
      - "python/tooling/"
      - "python/packages/lab/"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      basics:
        patterns:
          - "ruff"
          - "prek"
          - "poethepoet"
          - "tomli"
          - "rich"
          - "packaging"
          - "pygments"
          - "griffe"
          - "opentelemetry-sdk"
      pytest:
        patterns:
          - "pytest*"
      flit:
        patterns:
          - "flit*"
      python-type-checkers:
        patterns:
          - "mypy"
          - "pyright"
          - "pyrefly"
          - "ty"
          - "zuban"
    # Root uv upgrades must update required-version, workflow pins, and the
    # pre-commit revision together. Lab retains its independent uv updater.
    ignore:
      - dependency-name: "uv"
    labels:
      - "python"
      - "dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "python/"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      # Single-version tools in python/tooling/requirements-*.txt are handled
      # by the pip updater above. This entry covers pyproject.toml and uv.lock.
      basics:
        patterns:
          - "prek"
          - "poethepoet"
          - "tomli"
          - "rich"
          - "packaging"
          - "pygments"
          - "opentelemetry-sdk"
      pytest:
        patterns:
          - "pytest*"
      flit:
        patterns:
          - "flit*"
    # Avoid partial root uv bumps; coordinated uv upgrades are manual.
    ignore:
      - dependency-name: "uv"
    labels:
      - "python"
      - "dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "python/packages/lab/"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      basics:
        patterns:
          - "uv"
          - "ruff"
          - "prek"
          - "poethepoet"
          - "tomli"
          - "rich"
      pytest:
        patterns:
          - "pytest*"
      python-type-checkers:
        patterns:
          - "mypy"
          - "pyright"
    labels:
      - "python"
      - "lab"
      - "dependencies"
    cooldown:
      default-days: 7

  # Maintain npm dependencies for DevUI and sample frontends.
  - package-ecosystem: "npm"
    directories:
      - "/python/packages/devui/frontend"
      - "/python/samples/05-end-to-end/ag_ui_single_agent/frontend"
      - "/python/samples/05-end-to-end/ag_ui_workflow_handoff/frontend"
      - "/python/samples/05-end-to-end/chatkit-integration/frontend"
    schedule:
      interval: "weekly"
      day: "thursday"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # Maintain dependencies for github-actions
  - package-ecosystem: "github-actions"
    # Cover both the standard workflow location and our composite actions.
    # With `directory: "/"` Dependabot only scans `.github/workflows/*.{yml,yaml}`
    # plus a root-level `action.yml/action.yaml`. It does NOT recurse into
    # `.github/actions/*/action.yml`, so the glob below is required to keep the
    # composite actions in `.github/actions/<name>/` up to date as well.
    # Ref: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#directories-or-directory--
    directories:
      - "/"
      - "/.github/actions/*"
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
