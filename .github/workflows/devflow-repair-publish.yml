name: DevFlow approved publication
on:
  workflow_call:
    inputs:
      snapshot:
        type: string
        required: true
      snapshot_sha256:
        type: string
        required: true
      public_snapshot:
        type: string
        required: true
      public_sha256:
        type: string
        required: true
      devflow_sha:
        type: string
        required: true
      automation_sha:
        type: string
        required: true
      command:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      candidate_sha256:
        type: string
        required: true
      patch_sha256:
        type: string
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.command == '/fix' && 'devflow-pr-repair-publish' || 'devflow-ci-publish' }}
    env:
      SNAPSHOT: ${{ inputs.snapshot }}
      SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
      PUBLIC_SNAPSHOT: ${{ inputs.public_snapshot }}
      PUBLIC_SHA256: ${{ inputs.public_sha256 }}
      DEVFLOW_SHA: ${{ inputs.devflow_sha }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      PATCH_SHA256: ${{ inputs.patch_sha256 }}
      TARGET_REPO_PATH: ${{ github.workspace }}
      GH_RUN_ID: ${{ github.run_id }}
      DEVELOPER_TEAM: ${{ secrets.DEVELOPER_TEAM }}
      DEVFLOW_APPROVAL_ENVIRONMENT: ${{ inputs.command == '/fix' && 'devflow-pr-repair-publish' || 'devflow-ci-publish' }}
    steps:
      - name: Checkout trusted automation only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.automation_sha }}
          persist-credentials: false
      - name: Validate public authorization and controller binding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { decodeBound } = require('./.github/scripts/fix_ci_snapshot.js');
            const { json } = decodeBound({
              base64: process.env.SNAPSHOT, sha256: process.env.SNAPSHOT_SHA256,
              publicBase64: process.env.PUBLIC_SNAPSHOT, publicSha256: process.env.PUBLIC_SHA256,
              devflowSha: process.env.DEVFLOW_SHA, context,
            });
            require('node:fs').writeFileSync(`${process.env.RUNNER_TEMP}/repair-snapshot.json`, json, { mode: 0o600 });
      - name: Checkout pinned private controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.DF_REPO }}
          ref: ${{ inputs.devflow_sha }}
          token: ${{ secrets.DEVFLOW_TOKEN }}
          path: devflow
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.x'
          enable-cache: false
      - name: Install trusted controller dependencies
        working-directory: devflow
        run: uv sync --frozen
      - name: Download the exact candidate approved for this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/publication-input
          merge-multiple: true
      - name: Get repository-scoped App token
        id: read-auth
        uses: ./.github/actions/github-app-token
        with:
          mode: app
          azure-client-id: ${{ secrets.GH_APP_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.GH_APP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.GH_APP_AZURE_SUBSCRIPTION_ID }}
          key-vault-name: ${{ secrets.GH_APP_KEY_VAULT_NAME }}
          key-name: ${{ secrets.GH_APP_KEY_NAME }}
          github-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          github-app-installation-id: ${{ secrets.GH_APP_INSTALLATION_ID }}
          repository: ${{ github.repository }}
          contents-permission: read
          actions-permission: read
          issues-permission: read
          pull-requests-permission: read
      - name: Revalidate exact patch, head, verification and approval before write authority
        working-directory: devflow
        env:
          GH_TOKEN: ${{ steps.read-auth.outputs.token }}
          DEVFLOW_PUBLISH_AUTH_SOURCE: ${{ steps.read-auth.outputs.source }}
          DEVFLOW_PUBLISH_AUTHORIZATION: ${{ steps.read-auth.outputs.authorization }}
        run: >-
          uv run python scripts/trigger_fix_ci.py --phase validate-publication
          --candidate "$RUNNER_TEMP/publication-input/candidate.json"
          --candidate-sha256 "$CANDIDATE_SHA256"
          --snapshot "$RUNNER_TEMP/repair-snapshot.json"
          --snapshot-sha256 "$SNAPSHOT_SHA256"
      - name: Get repository-scoped App token
        id: write-auth
        uses: ./.github/actions/github-app-token
        with:
          mode: app
          azure-client-id: ${{ secrets.GH_APP_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.GH_APP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.GH_APP_AZURE_SUBSCRIPTION_ID }}
          key-vault-name: ${{ secrets.GH_APP_KEY_VAULT_NAME }}
          key-name: ${{ secrets.GH_APP_KEY_NAME }}
          github-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          github-app-installation-id: ${{ secrets.GH_APP_INSTALLATION_ID }}
          repository: ${{ github.repository }}
          contents-permission: write
          actions-permission: read
          issues-permission: write
          pull-requests-permission: read
      - name: Atomically publish the revalidated candidate without executing PR code
        working-directory: devflow
        env:
          GH_TOKEN: ${{ steps.write-auth.outputs.token }}
          DEVFLOW_PUBLISH_AUTH_SOURCE: ${{ steps.write-auth.outputs.source }}
          DEVFLOW_PUBLISH_AUTHORIZATION: ${{ steps.write-auth.outputs.authorization }}
        run: >-
          uv run python scripts/trigger_fix_ci.py --phase publish
          --candidate "$RUNNER_TEMP/publication-input/candidate.json"
          --candidate-sha256 "$CANDIDATE_SHA256"
          --snapshot "$RUNNER_TEMP/repair-snapshot.json"
          --snapshot-sha256 "$SNAPSHOT_SHA256"
