name: DevFlow authorized repair pipeline
on:
  workflow_call:
    inputs:
      snapshot:
        type: string
        required: true
      snapshot_sha256:
        type: string
        required: true
      public_snapshot:
        type: string
        required: true
      public_sha256:
        type: string
        required: true
      devflow_sha:
        type: string
        required: true
      automation_sha:
        type: string
        required: true
      command:
        type: string
        required: true
permissions:
  contents: read
  actions: read
  issues: write
  id-token: write
  copilot-requests: write
jobs:
  controller_0:
    uses: ./.github/workflows/devflow-repair-controller.yml
    with:
      snapshot: ${{ inputs.snapshot }}
      snapshot_sha256: ${{ inputs.snapshot_sha256 }}
      public_snapshot: ${{ inputs.public_snapshot }}
      public_sha256: ${{ inputs.public_sha256 }}
      devflow_sha: ${{ inputs.devflow_sha }}
      automation_sha: ${{ inputs.automation_sha }}
      stage: '0'
    secrets: inherit
  verifier_1:
    needs: controller_0
    if: ${{ needs.controller_0.outputs.status == 'pending' }}
    permissions: {}
    uses: ./.github/workflows/devflow-repair-verification.yml
    with:
      automation_sha: ${{ inputs.automation_sha }}
      artifact_id: ${{ needs.controller_0.outputs.artifact_id }}
      request_sha256: ${{ needs.controller_0.outputs.request_sha256 }}
      stage: '1'
  controller_1:
    needs: [controller_0, verifier_1]
    if: ${{ needs.controller_0.outputs.status == 'pending' }}
    uses: ./.github/workflows/devflow-repair-controller.yml
    with:
      snapshot: ${{ inputs.snapshot }}
      snapshot_sha256: ${{ inputs.snapshot_sha256 }}
      public_snapshot: ${{ inputs.public_snapshot }}
      public_sha256: ${{ inputs.public_sha256 }}
      devflow_sha: ${{ inputs.devflow_sha }}
      automation_sha: ${{ inputs.automation_sha }}
      stage: '1'
      state_artifact_id: ${{ needs.controller_0.outputs.artifact_id }}
      state_sha256: ${{ needs.controller_0.outputs.state_sha256 }}
      verification_artifact_id: ${{ needs.verifier_1.outputs.artifact_id }}
      verification_sha256: ${{ needs.verifier_1.outputs.result_sha256 }}
    secrets: inherit
  verifier_2:
    needs: controller_1
    if: ${{ needs.controller_1.outputs.status == 'pending' }}
    permissions: {}
    uses: ./.github/workflows/devflow-repair-verification.yml
    with:
      automation_sha: ${{ inputs.automation_sha }}
      artifact_id: ${{ needs.controller_1.outputs.artifact_id }}
      request_sha256: ${{ needs.controller_1.outputs.request_sha256 }}
      stage: '2'
  controller_2:
    needs: [controller_1, verifier_2]
    if: ${{ needs.controller_1.outputs.status == 'pending' }}
    uses: ./.github/workflows/devflow-repair-controller.yml
    with:
      snapshot: ${{ inputs.snapshot }}
      snapshot_sha256: ${{ inputs.snapshot_sha256 }}
      public_snapshot: ${{ inputs.public_snapshot }}
      public_sha256: ${{ inputs.public_sha256 }}
      devflow_sha: ${{ inputs.devflow_sha }}
      automation_sha: ${{ inputs.automation_sha }}
      stage: '2'
      state_artifact_id: ${{ needs.controller_1.outputs.artifact_id }}
      state_sha256: ${{ needs.controller_1.outputs.state_sha256 }}
      verification_artifact_id: ${{ needs.verifier_2.outputs.artifact_id }}
      verification_sha256: ${{ needs.verifier_2.outputs.result_sha256 }}
    secrets: inherit
  verifier_3:
    needs: controller_2
    if: ${{ needs.controller_2.outputs.status == 'pending' }}
    permissions: {}
    uses: ./.github/workflows/devflow-repair-verification.yml
    with:
      automation_sha: ${{ inputs.automation_sha }}
      artifact_id: ${{ needs.controller_2.outputs.artifact_id }}
      request_sha256: ${{ needs.controller_2.outputs.request_sha256 }}
      stage: '3'
  controller_3:
    needs: [controller_2, verifier_3]
    if: ${{ needs.controller_2.outputs.status == 'pending' }}
    uses: ./.github/workflows/devflow-repair-controller.yml
    with:
      snapshot: ${{ inputs.snapshot }}
      snapshot_sha256: ${{ inputs.snapshot_sha256 }}
      public_snapshot: ${{ inputs.public_snapshot }}
      public_sha256: ${{ inputs.public_sha256 }}
      devflow_sha: ${{ inputs.devflow_sha }}
      automation_sha: ${{ inputs.automation_sha }}
      stage: '3'
      state_artifact_id: ${{ needs.controller_2.outputs.artifact_id }}
      state_sha256: ${{ needs.controller_2.outputs.state_sha256 }}
      verification_artifact_id: ${{ needs.verifier_3.outputs.artifact_id }}
      verification_sha256: ${{ needs.verifier_3.outputs.result_sha256 }}
    secrets: inherit
  verifier_4:
    needs: controller_3
    if: ${{ needs.controller_3.outputs.status == 'pending' }}
    permissions: {}
    uses: ./.github/workflows/devflow-repair-verification.yml
    with:
      automation_sha: ${{ inputs.automation_sha }}
      artifact_id: ${{ needs.controller_3.outputs.artifact_id }}
      request_sha256: ${{ needs.controller_3.outputs.request_sha256 }}
      stage: '4'
  controller_4:
    needs: [controller_3, verifier_4]
    if: ${{ needs.controller_3.outputs.status == 'pending' }}
    uses: ./.github/workflows/devflow-repair-controller.yml
    with:
      snapshot: ${{ inputs.snapshot }}
      snapshot_sha256: ${{ inputs.snapshot_sha256 }}
      public_snapshot: ${{ inputs.public_snapshot }}
      public_sha256: ${{ inputs.public_sha256 }}
      devflow_sha: ${{ inputs.devflow_sha }}
      automation_sha: ${{ inputs.automation_sha }}
      stage: '4'
      state_artifact_id: ${{ needs.controller_3.outputs.artifact_id }}
      state_sha256: ${{ needs.controller_3.outputs.state_sha256 }}
      verification_artifact_id: ${{ needs.verifier_4.outputs.artifact_id }}
      verification_sha256: ${{ needs.verifier_4.outputs.result_sha256 }}
    secrets: inherit
  verifier_5:
    needs: controller_4
    if: ${{ needs.controller_4.outputs.status == 'pending' }}
    permissions: {}
    uses: ./.github/workflows/devflow-repair-verification.yml
    with:
      automation_sha: ${{ inputs.automation_sha }}
      artifact_id: ${{ needs.controller_4.outputs.artifact_id }}
      request_sha256: ${{ needs.controller_4.outputs.request_sha256 }}
      stage: '5'
  controller_5:
    needs: [controller_4, verifier_5]
    if: ${{ needs.controller_4.outputs.status == 'pending' }}
    uses: ./.github/workflows/devflow-repair-controller.yml
    with:
      snapshot: ${{ inputs.snapshot }}
      snapshot_sha256: ${{ inputs.snapshot_sha256 }}
      public_snapshot: ${{ inputs.public_snapshot }}
      public_sha256: ${{ inputs.public_sha256 }}
      devflow_sha: ${{ inputs.devflow_sha }}
      automation_sha: ${{ inputs.automation_sha }}
      stage: '5'
      state_artifact_id: ${{ needs.controller_4.outputs.artifact_id }}
      state_sha256: ${{ needs.controller_4.outputs.state_sha256 }}
      verification_artifact_id: ${{ needs.verifier_5.outputs.artifact_id }}
      verification_sha256: ${{ needs.verifier_5.outputs.result_sha256 }}
    secrets: inherit
  select_result:
    needs: [controller_0, controller_1, controller_2, controller_3, controller_4, controller_5]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    outputs:
      status: ${{ steps.select.outputs.status }}
      state_sha256: ${{ steps.select.outputs.state_sha256 }}
      request_sha256: ${{ steps.select.outputs.request_sha256 }}
      candidate_sha256: ${{ steps.select.outputs.candidate_sha256 }}
      patch_sha256: ${{ steps.select.outputs.patch_sha256 }}
      notice_sha256: ${{ steps.select.outputs.notice_sha256 }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
    steps:
      - name: Select one terminal trusted controller result
        id: select
        env:
          CONTROLLERS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          jobs = json.loads(os.environ['CONTROLLERS'])
          terminal = [job['outputs'] for job in jobs.values() if job['result'] == 'success' and job['outputs'].get('status') in ('ready', 'done')]
          if len(terminal) > 1:
              raise SystemExit('Ambiguous terminal controller artifacts')
          chosen = terminal[0] if terminal else {'status': 'failed'}
          allowed = ('status', 'state_sha256', 'request_sha256', 'candidate_sha256', 'patch_sha256', 'notice_sha256', 'artifact_id')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in allowed:
                  value = chosen.get(key, '')
                  if key.endswith('sha256') and value and not re.fullmatch('[0-9a-f]{64}', value):
                      raise SystemExit('Invalid artifact digest')
                  if key == 'artifact_id' and value and not value.isdigit():
                      raise SystemExit('Invalid artifact ID')
                  output.write(f'{key}={value}\n')
          PYTHON

  report:
    needs: select_result
    if: ${{ always() && !cancelled() && needs.select_result.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Download terminal controller artifact
        if: ${{ needs.select_result.outputs.artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.select_result.outputs.artifact_id }}
          path: ${{ runner.temp }}/report-input
          merge-multiple: true
      - name: Report status or exact-diff approval instructions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATUS: ${{ needs.select_result.outputs.status }}
          ARTIFACT_ID: ${{ needs.select_result.outputs.artifact_id }}
          NOTICE_SHA256: ${{ needs.select_result.outputs.notice_sha256 }}
          CANDIDATE_SHA256: ${{ needs.select_result.outputs.candidate_sha256 }}
          PATCH_SHA256: ${{ needs.select_result.outputs.patch_sha256 }}
          REPAIR_COMMAND: ${{ inputs.command }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            const read = (name, expected, limit) => {
              const bytes = fs.readFileSync(`${process.env.RUNNER_TEMP}/report-input/${name}`);
              if (bytes.length > limit || !/^[0-9a-f]{64}$/.test(expected || '') || hash(bytes) !== expected) throw new Error('Artifact integrity mismatch');
              return bytes;
            };
            let body = 'The PR repair run could not complete. Please inspect the automation run before retrying.';
            if (process.env.STATUS === 'ready') {
              read('candidate.json', process.env.CANDIDATE_SHA256, 2000000);
              read('candidate.diff', process.env.PATCH_SHA256, 200000);
              const artifact = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${process.env.ARTIFACT_ID}`;
              body = `A verified repair candidate is ready. Review candidate.diff in [the immutable artifact](${artifact}). Patch SHA-256: \`${process.env.PATCH_SHA256}\`.`;
              if (process.env.REPAIR_COMMAND === '/fix') body += ` To publish, approve the devflow-pr-repair-publish environment and include \`patch-sha256:${process.env.PATCH_SHA256}\` in your approval comment.`;
            } else if (process.env.STATUS === 'done' && process.env.NOTICE_SHA256) {
              const notice = JSON.parse(read('notice.json', process.env.NOTICE_SHA256, 16000));
              if (typeof notice.message !== 'string' || notice.message.length > 4000) throw new Error('Invalid controller notice');
              body = notice.message;
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.payload.issue.number, body });
            await core.summary.addRaw(body).write();

  publish:
    needs: [select_result, report]
    if: ${{ needs.select_result.outputs.status == 'ready' }}
    uses: ./.github/workflows/devflow-repair-publish.yml
    with:
      snapshot: ${{ inputs.snapshot }}
      snapshot_sha256: ${{ inputs.snapshot_sha256 }}
      public_snapshot: ${{ inputs.public_snapshot }}
      public_sha256: ${{ inputs.public_sha256 }}
      devflow_sha: ${{ inputs.devflow_sha }}
      automation_sha: ${{ inputs.automation_sha }}
      command: ${{ inputs.command }}
      artifact_id: ${{ needs.select_result.outputs.artifact_id }}
      candidate_sha256: ${{ needs.select_result.outputs.candidate_sha256 }}
      patch_sha256: ${{ needs.select_result.outputs.patch_sha256 }}
    secrets: inherit
