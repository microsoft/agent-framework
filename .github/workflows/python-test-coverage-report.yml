name: Python - Test Coverage Report

on:
  workflow_run:
    workflows: ["Python - Test Coverage"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  code-quality: write
  pull-requests: read

jobs:
  python-test-coverage-report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: python-coverage-report
          path: python
      - name: Upload coverage report to GitHub
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: python/python-coverage.xml
          language: Python
          label: code-coverage/python
          fail-on-error: false
      - name: Summarize GitHub coverage report
        run: echo "Python coverage is uploaded to GitHub's integrated coverage report with label \`code-coverage/python\`." >> "$GITHUB_STEP_SUMMARY"
