name: GitHub automation tests

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/python-api-compatibility.yml"
      - ".github/workflows/python-test-coverage.yml"
      - ".github/workflows/github-automation-tests.yml"
      - ".github/workflows/devflow-fix-ci.yml"
      - ".github/workflows/issue-plan.md"
      - ".github/workflows/issue-plan.lock.yml"
      - "python/pyproject.toml"
      - "python/tooling/requirements-api-compatibility.txt"
      - "python/uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/python-api-compatibility.yml"
      - ".github/workflows/python-test-coverage.yml"
      - ".github/workflows/github-automation-tests.yml"
      - ".github/workflows/devflow-fix-ci.yml"
      - ".github/workflows/issue-plan.md"
      - ".github/workflows/issue-plan.lock.yml"
      - "python/pyproject.toml"
      - "python/tooling/requirements-api-compatibility.txt"
      - "python/uv.lock"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Run JavaScript tests
        run: node --test .github/tests/*.js

      - name: Run Python tests
        run: python .github/tests/test_python_check_coverage.py

      - name: Run Python API compatibility tests
        working-directory: ${{ runner.temp }}
        env:
          UV_NO_CONFIG: "1"
        run: |
          griffe_requirement="$(
            python3 - "$GITHUB_WORKSPACE/python/tooling/requirements-api-compatibility.txt" <<'PY'
          import sys

          requirements = [
              line.strip()
              for line in open(sys.argv[1], encoding="utf-8")
              if line.strip() and not line.lstrip().startswith("#")
          ]
          if len(requirements) != 1:
              raise SystemExit("Expected exactly one Griffe tool requirement")
          print(requirements[0])
          PY
          )"

          uv --no-config run \
            --no-project \
            --with "$griffe_requirement" \
            python "$GITHUB_WORKSPACE/.github/tests/test_python_api_compatibility.py"
