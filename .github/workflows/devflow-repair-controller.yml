name: DevFlow repair controller
on:
  workflow_call:
    inputs:
      snapshot:
        type: string
        required: true
      snapshot_sha256:
        type: string
        required: true
      public_snapshot:
        type: string
        required: true
      public_sha256:
        type: string
        required: true
      devflow_sha:
        type: string
        required: true
      automation_sha:
        type: string
        required: true
      stage:
        type: string
        required: true
      state_artifact_id:
        type: string
        required: false
      state_sha256:
        type: string
        required: false
      verification_artifact_id:
        type: string
        required: false
      verification_sha256:
        type: string
        required: false
    outputs:
      status:
        value: ${{ jobs.controller.outputs.status }}
      state_sha256:
        value: ${{ jobs.controller.outputs.state_sha256 }}
      request_sha256:
        value: ${{ jobs.controller.outputs.request_sha256 }}
      candidate_sha256:
        value: ${{ jobs.controller.outputs.candidate_sha256 }}
      patch_sha256:
        value: ${{ jobs.controller.outputs.patch_sha256 }}
      notice_sha256:
        value: ${{ jobs.controller.outputs.notice_sha256 }}
      artifact_id:
        value: ${{ jobs.controller.outputs.artifact_id }}
permissions:
  contents: read
  actions: read
  id-token: write
  copilot-requests: write
jobs:
  controller:
    runs-on: ubuntu-latest
    environment: github-app-auth
    timeout-minutes: 25
    outputs:
      status: ${{ steps.phase.outputs.status }}
      state_sha256: ${{ steps.phase.outputs.state_sha256 }}
      request_sha256: ${{ steps.phase.outputs.request_sha256 }}
      candidate_sha256: ${{ steps.phase.outputs.candidate_sha256 }}
      patch_sha256: ${{ steps.phase.outputs.patch_sha256 }}
      notice_sha256: ${{ steps.phase.outputs.notice_sha256 }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      SNAPSHOT: ${{ inputs.snapshot }}
      SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
      PUBLIC_SNAPSHOT: ${{ inputs.public_snapshot }}
      PUBLIC_SHA256: ${{ inputs.public_sha256 }}
      DEVFLOW_SHA: ${{ inputs.devflow_sha }}
      TARGET_REPO_PATH: ${{ github.workspace }}
      MODEL_CONFIG_PATH: ${{ github.workspace }}/devflow/config.ci.yaml
      STATE_SHA256: ${{ inputs.state_sha256 }}
      VERIFICATION_SHA256: ${{ inputs.verification_sha256 }}
    steps:
      - name: Checkout trusted automation only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.automation_sha }}
          persist-credentials: false
      - name: Validate public authorization and controller binding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { decodeBound } = require('./.github/scripts/fix_ci_snapshot.js');
            const { json } = decodeBound({
              base64: process.env.SNAPSHOT, sha256: process.env.SNAPSHOT_SHA256,
              publicBase64: process.env.PUBLIC_SNAPSHOT, publicSha256: process.env.PUBLIC_SHA256,
              devflowSha: process.env.DEVFLOW_SHA, context,
            });
            require('node:fs').writeFileSync(`${process.env.RUNNER_TEMP}/repair-snapshot.json`, json, { mode: 0o600 });
      - name: Get repository-scoped App token
        id: auth
        uses: ./.github/actions/github-app-token
        with:
          mode: app
          azure-client-id: ${{ secrets.GH_APP_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.GH_APP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.GH_APP_AZURE_SUBSCRIPTION_ID }}
          key-vault-name: ${{ secrets.GH_APP_KEY_VAULT_NAME }}
          key-name: ${{ secrets.GH_APP_KEY_NAME }}
          github-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          github-app-installation-id: ${{ secrets.GH_APP_INSTALLATION_ID }}
          repository: ${{ github.repository }}
          contents-permission: read
          actions-permission: read
          issues-permission: read
          pull-requests-permission: read
      - name: Checkout pinned private controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.DF_REPO }}
          ref: ${{ inputs.devflow_sha }}
          token: ${{ secrets.DEVFLOW_TOKEN }}
          path: devflow
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.x'
          enable-cache: false
      - name: Install trusted controller dependencies
        working-directory: devflow
        run: uv sync --frozen
      - name: Download immutable predecessor state
        if: ${{ inputs.state_artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.state_artifact_id }}
          path: ${{ runner.temp }}/previous-state
          merge-multiple: true
      - name: Download matching verification result
        if: ${{ inputs.verification_artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.verification_artifact_id }}
          path: ${{ runner.temp }}/previous-verification
          merge-multiple: true
      - name: Advance trusted controller without executing PR code
        id: phase
        working-directory: devflow
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          DEVFLOW_MODEL_TOKEN: ${{ github.token }}
          DEVFLOW_PUBLISH_AUTH_SOURCE: ${{ steps.auth.outputs.source }}
          DEVFLOW_PUBLISH_AUTHORIZATION: ${{ steps.auth.outputs.authorization }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--phase controller --snapshot "$RUNNER_TEMP/repair-snapshot.json" --snapshot-sha256 "$SNAPSHOT_SHA256" --out-dir "$RUNNER_TEMP/controller-output")
          if [[ -n "$STATE_SHA256" ]]; then
            args+=(--state "$RUNNER_TEMP/previous-state/controller-state.json" --state-sha256 "$STATE_SHA256")
          fi
          if [[ -n "$VERIFICATION_SHA256" ]]; then
            args+=(--verification-result "$RUNNER_TEMP/previous-verification/result.json" --verification-sha256 "$VERIFICATION_SHA256")
          fi
          uv run python scripts/trigger_fix_ci.py "${args[@]}"
      - name: Retain only bounded protocol artifacts
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repair-controller-${{ github.run_id }}-${{ inputs.stage }}
          path: |
            ${{ runner.temp }}/controller-output/controller-state.json
            ${{ runner.temp }}/controller-output/verification-request.json
            ${{ runner.temp }}/controller-output/candidate.json
            ${{ runner.temp }}/controller-output/candidate.diff
            ${{ runner.temp }}/controller-output/notice.json
          if-no-files-found: error
          retention-days: 7
