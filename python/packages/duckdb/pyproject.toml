[project]
name = "agent-framework-duckdb"
description = "DuckDB vector stores for Microsoft Agent Framework."
authors = [{ name = "Microsoft", email = "af-support@microsoft.com" }]
readme = "README.md"
requires-python = ">=3.10"
version = "1.0.0a260923"
license-files = ["LICENSE"]
urls.homepage = "https://aka.ms/agent-framework"
urls.source = "https://github.com/microsoft/agent-framework/tree/main/python"
urls.issues = "https://github.com/microsoft/agent-framework/issues"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "agent-framework-core>=1.19.0,<2",
    "duckdb>=1.4.1,<1.6",
    "pytz>=2024.1,<2027",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"samples/**" = ["D", "INP", "TD", "ERA001", "RUF", "S", "T201", "CPY"]
"tests/**" = ["D", "INP", "TD", "ERA001", "RUF", "S"]

[tool.pyright]
extends = "../../pyproject.toml"
include = ["agent_framework_duckdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -r fEX"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60

[tool.coverage.run]
omit = ["**/__init__.py"]

[tool.poe]
executor.type = "uv"
include = "../../shared_tasks.toml"

[tool.poe.tasks.test]
help = "Run DuckDB connector unit tests."
cmd = 'pytest -m "not integration" --cov=agent_framework_duckdb --cov-report=term-missing:skip-covered tests'

[build-system]
requires = ["flit-core>=3.11,<4.0"]
build-backend = "flit_core.buildapi"
