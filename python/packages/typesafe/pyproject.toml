[project]
name = "agent-framework-typesafe"
description = "TypeSafe AI integration for Microsoft Agent Framework."
authors = [{ name = "Microsoft", email = "af-support@microsoft.com" }]
readme = "README.md"
requires-python = ">=3.10"
version = "1.0.0a260920"
license-files = ["LICENSE"]
urls.homepage = "https://aka.ms/agent-framework"
urls.source = "https://github.com/microsoft/agent-framework/tree/main/python"
urls.release_notes = "https://github.com/microsoft/agent-framework/releases?q=tag%3Apython-1&expanded=true"
urls.issues = "https://github.com/microsoft/agent-framework/issues"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
]
dependencies = [
    "agent-framework-core>=1.19.0,<2",
    "typesafe-sdk>=0.7.0,<0.8.0",
]

[tool.uv]
prerelease = "if-necessary"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -r fEX"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
    "integration: marks tests that require the TypeSafe AI service",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"samples/**" = ["D", "INP", "commented-out-code", "RUF", "S", "print", "CPY"]
"tests/**" = ["D", "INP", "TD", "commented-out-code", "RUF", "S"]

[tool.coverage.run]
omit = ["**/__init__.py"]

[tool.pyright]
extends = "../../pyproject.toml"
include = ["agent_framework_typesafe"]
exclude = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_unimported = true

[tool.bandit]
targets = ["agent_framework_typesafe"]
exclude_dirs = ["tests"]

[tool.poe]
executor.type = "uv"
include = "../../shared_tasks.toml"

[tool.poe.tasks.mypy]
help = "Run MyPy for this package."
cmd = "mypy --config-file $POE_ROOT/pyproject.toml agent_framework_typesafe"

[tool.poe.tasks.test]
help = "Run the default unit test suite for this package."
cmd = 'pytest -m "not integration" --cov=agent_framework_typesafe --cov-report=term-missing:skip-covered tests'

[tool.uv.build-backend]
module-name = "agent_framework_typesafe"
module-root = ""

[build-system]
requires = ["uv_build>=0.8.2,<0.13.0"]
build-backend = "uv_build"
