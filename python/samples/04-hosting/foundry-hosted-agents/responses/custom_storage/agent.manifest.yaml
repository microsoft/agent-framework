name: agent-framework-agent-custom-storage-responses
description: >
  An Agent Framework agent that uses custom Cosmos DB session storage when hosted.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
    - Custom Storage
template:
  name: agent-framework-agent-custom-storage-responses
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: COSMOS_CONNECTION_STRING
      value: "{{COSMOS_CONNECTION_STRING}}"
    - name: COSMOS_DATABASE_NAME
      value: "{{COSMOS_DATABASE_NAME}}"
    - name: COSMOS_CONTAINER_NAME
      value: "{{COSMOS_CONTAINER_NAME}}"
resources:
  - kind: model
    id: gpt-4.1-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
