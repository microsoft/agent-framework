# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Keep this short: azd builds the ARM deployment name as
# "azd-foundry-<name>-<env>-<hash>", which must be <= 64 chars.
name: af-basic-harness
services:
    agent-framework-agent-basic-responsesharnessagent:
        project: src/agent-framework-agent-basic-responsesharnessagent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            A basic Agent Framework agent hosted by Foundry.
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: gpt-5-mini
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: agent-framework-agent-basic-responsesharnessagent
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5-mini
                version: "2025-08-07"
              name: gpt-5-mini
              sku:
                capacity: 970
                name: GlobalStandard
infra:
    provider: microsoft.foundry
