# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: hosted-workflow-handoff
services:
    ai-project:
        host: azure.ai.project
    hosted-workflow-handoff:
        project: .
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: HostedWorkflowHandoff.dll
            runtime: dotnet_10
        # ASPNETCORE_URLS pins the readiness port (8088). The platform injects the Foundry project
        # endpoint, while the selected project model deployment comes from the active azd environment.
        env:
            ASPNETCORE_URLS: http://+:8088
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            A hosted triage handoff workflow routing to specialist agents, backed by a Foundry project model.
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Azure AI AgentServer
                - Agent Framework
        name: hosted-workflow-handoff
        protocols:
            - protocol: responses
              version: 2.0.0