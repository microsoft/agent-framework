# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: hosted-workflow-resilient-long-running
services:
    ai-project:
        host: azure.ai.project
    hosted-workflow-resilient-long-running:
        project: .
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: HostedWorkflowResilientLongRunning.dll
            runtime: dotnet_10
        env:
            ASPNETCORE_URLS: http://+:8088
            COUNTDOWN_DELAY_SECONDS: "1"
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            A resilient long-running countdown workflow hosted with the Foundry Responses protocol.
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Azure AI AgentServer
                - Agent Framework
                - Resilient Background
                - Long Running
        name: hosted-workflow-resilient-long-running
        protocols:
            - protocol: responses
              version: 2.0.0
