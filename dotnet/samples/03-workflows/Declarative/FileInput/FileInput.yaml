#
# This workflow demonstrates accepting a text file's content as workflow input.
#
kind: Workflow
trigger:

  kind: OnConversationStart
  id: workflow_demo
  actions:

    # Show that the workflow can inspect the text message.
    - kind: SendActivity
      id: announce_file_input
      activity: |-
        Received file-based workflow input.

        Prompt:
        {System.LastMessage.Text}

    # Invoke an agent in the original conversation.
    - kind: InvokeAzureAgent
      id: summarize_file
      conversationId: =System.ConversationId
      agent:
        name: FileInputAgent
      output:
        autoSend: true
