#
# This workflow demonstrates accepting file-based input as workflow input.
#
# Example input:
# dotnet run ProductBrief.txt "Summarize this product brief for a launch announcement."
#
kind: Workflow
trigger:

  kind: OnConversationStart
  id: workflow_demo
  actions:

    # Capture the complete incoming ChatMessage, including non-text content.
    - kind: SetVariable
      id: capture_input_message
      variable: Local.InputMessage
      value: =System.LastMessage

    # Show that the workflow can inspect the message text and content collection.
    - kind: SendActivity
      id: announce_file_input
      activity: |-
        Received file-based workflow input.

        Prompt:
        {System.LastMessage.Text}

        Content item count:
        {CountRows(System.LastMessage.Content)}

    # Invoke an agent in the original conversation. The workflow root already added
    # the file-bearing user message to this conversation before the first action ran.
    - kind: InvokeAzureAgent
      id: summarize_file
      conversationId: =System.ConversationId
      agent:
        name: FileInputAgent
      output:
        autoSend: true
